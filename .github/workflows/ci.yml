name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: ${{ matrix.node }}
          cache: true
      - run: vp run lint
      - run: vp run fmt:check
      - run: vp run typecheck
      - run: vp run test
      - name: Rebuild Data packs from Snapshots
        run: vp run @geo-resolve/codegen#build
      - name: Fail if the generated Data packs differ from what is committed
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  iso-codes:
    name: Compare with iso-codes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true
      - name: Compare the committed Data packs with the pinned iso-codes release
        run: vp run @geo-resolve/codegen#compare-iso-codes
