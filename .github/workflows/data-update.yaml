name: Data update

# The weekly data update (ADR-0008): refresh the Snapshots, rebuild the Data packs and open a PR for review.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # To dispatch CI on the PR branch, since pushes and PRs made with the workflow token trigger no workflows
  actions: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    name: Fetch Snapshots and open a data-update PR
    runs-on: ubuntu-latest
    env:
      BRANCH: chore/data-update
      ALIAS_REMOVALS_LABEL: alias-removals
      # Requested as a reviewer whenever the PR is opened or updated, so a data update notifies the maintainer
      REVIEWER: ${{ github.repository_owner }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # Always from main, so a manual run from another branch can't base the PR on it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .nvmrc
          cache: true
      - name: Fetch Snapshots from CLDR and Wikidata
        run: vp run @geo-resolve/codegen#fetch-snapshots
      - name: Keep main's Data packs, to compare with the rebuilt ones
        run: cp -R packages/geo-resolve/src/data "$RUNNER_TEMP/data-before"
      - name: Rebuild Data packs from Snapshots
        run: vp run @geo-resolve/codegen#build
      # Decides everything the PR carries in tools/codegen/src/data-update.ts, where it is tested: the Aliases added
      # and removed, a flag when removals outnumber additions by over ALIAS_REMOVAL_THRESHOLD, the changeset bump
      # under ADR-0007 (none when flagged), and the PR title and body, which name only the changed Sources and show
      # the build report and Snapshot diffs
      - name: Assess the update if the Snapshots changed
        id: assess
        run: |
          if [ -z "$(git status --porcelain -- tools/codegen/sources)" ]; then
            echo "The Snapshots are unchanged."
            exit 0
          fi
          sources=()
          if [ -n "$(git status --porcelain -- tools/codegen/sources/cldr)" ]; then sources+=(CLDR); fi
          if [ -n "$(git status --porcelain -- tools/codegen/sources/wikidata)" ]; then sources+=(Wikidata); fi
          git diff -- tools/codegen/build-report.md > "$RUNNER_TEMP/build-report.diff"
          git diff -- tools/codegen/sources > "$RUNNER_TEMP/snapshots.diff"
          vp run @geo-resolve/codegen#data-update "$RUNNER_TEMP/data-before" "$RUNNER_TEMP/build-report.diff" "$RUNNER_TEMP/snapshots.diff" "$RUNNER_TEMP/update" "${sources[@]}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Commit the changes to the data-update branch
        id: commit
        if: steps.assess.outputs.changed == 'true'
        run: |
          if [ -f "$RUNNER_TEMP/update/changeset.md" ]; then
            cp "$RUNNER_TEMP/update/changeset.md" .changeset/data-update.md
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add -A
          git commit -m "$(cat "$RUNNER_TEMP/update/title.txt")"
          # Skip the push, and the CI run it needs, when the open PR already has these exact changes
          if git fetch --depth 1 origin "$BRANCH" && git diff --quiet FETCH_HEAD HEAD; then
            echo "The data-update branch already has these changes."
            exit 0
          fi
          git push --force origin "$BRANCH"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Open or update the PR
        if: steps.commit.outputs.pushed == 'true'
        run: |
          title=$(cat "$RUNNER_TEMP/update/title.txt")
          body="$RUNNER_TEMP/update/body.md"
          pr=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "$title" --body-file "$body" --add-reviewer "$REVIEWER"
          else
            pr=$(gh pr create --head "$BRANCH" --base main --title "$title" --body-file "$body" --reviewer "$REVIEWER")
          fi
          if [ "$(jq -r .flagged "$RUNNER_TEMP/update/update.json")" = "true" ]; then
            gh label create "$ALIAS_REMOVALS_LABEL" --force --color D93F0B --description "A data update that removes many more Aliases than it adds"
            gh pr edit "$pr" --add-label "$ALIAS_REMOVALS_LABEL"
          # An earlier run on this PR may have flagged it
          elif gh pr view "$pr" --json labels --jq '.labels[].name' | grep -qx "$ALIAS_REMOVALS_LABEL"; then
            gh pr edit "$pr" --remove-label "$ALIAS_REMOVALS_LABEL"
          fi
      - name: Run CI on the PR branch
        if: steps.commit.outputs.pushed == 'true'
        run: gh workflow run ci.yaml --ref "$BRANCH"
