name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Dispatched by the data-update workflow, whose PRs trigger no pull_request runs
  workflow_dispatch:

permissions:
  contents: read

# PR runs share a group per branch, so a new push cancels the stale run.
# Each main commit gets its own group, so no main run is ever cancelled:
# GitHub keeps one waiting run per group and cancels it when another queues,
# and a cancelled run on main would skip that commit's Railway deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: ${{ matrix.node }}
          cache: true
      - run: vp run lint
      - run: vp run fmt:check
      - run: vp run typecheck
      - run: vp run test
      - name: Build the package, failing on publint or attw problems
        run: vp run geo-resolve#build
      - name: Fail if the public API differs from the committed API report
        run: vp run geo-resolve#api:check
      - name: Build the API reference, failing on any TypeDoc warning, such as an undocumented export
        run: vp run @geo-resolve/docs#build
      - name: Rebuild Data packs from Snapshots
        run: vp run @geo-resolve/codegen#build
      - name: Fail if the generated Data packs differ from what is committed
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  workflows:
    name: Lint the GitHub Actions workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # actionlint, with shellcheck on every `run:` script
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  iso-codes:
    name: Check data packs against ISO 3166
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .nvmrc
          cache: true
      - name: Compare the committed Data packs with the pinned iso-codes release
        run: vp run @geo-resolve/codegen#compare-iso-codes

  smoke:
    name: Smoke test the packed package in Bun, Deno and a browser bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smoke
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .nvmrc
          cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.6"
      - run: vp run geo-resolve#build
        working-directory: .
      - name: Pack the package as it would be published
        working-directory: packages/geo-resolve
        run: vp pm pack --out "$RUNNER_TEMP/geo-resolve.tgz"
      - name: Fail unless the tarball has the licence and the data attribution
        run: tar -tzf "$RUNNER_TEMP/geo-resolve.tgz" package/LICENSE package/NOTICE.md
      - name: Install the tarball outside the workspace
        run: npm install --no-package-lock --no-save "$RUNNER_TEMP/geo-resolve.tgz"
      - name: Bun
        run: bun smoke.js
      - name: Deno
        run: deno run smoke.js
      - name: Vite browser bundle (built with browser conditions, run headless in Node)
        run: npx vite build && node dist/smoke.js
