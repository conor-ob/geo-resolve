# Dependabot baseline. Source of truth: conor-ob/hq templates/dependabot/dependabot.yaml
# Policy and reasons: conor-ob/hq docs/dependabot.md
#
# Copy to .github/dependabot.yaml.
# Keep the baseline entries as they are. Repo-specific changes go under
# "Repo exceptions" comments, so a diff against the template shows only them.
version: 2

updates:
  # One entry per pnpm workspace, at the workspace root. It covers every
  # package in the workspace and the catalogs in pnpm-workspace.yaml.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Dublin
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      # Repo exceptions: the vite override (npm:@voidzero-dev/vite-plus-core@…)
      # must always match vite-plus, so they move together, majors included.
      # `vite` is listed too in case Dependabot names the alias by its key.
      # It comes before minor-and-patch, because an update joins the first
      # group that matches. It isn't an auto-merge group, so it's merged by hand.
      vite-plus:
        patterns:
          - vite-plus
          - "@voidzero-dev/vite-plus-core"
          - vite
      # Majors stay out of the group, so each one gets its own PR.
      minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      # Without prefix-development, dev dependencies use this prefix too.
      prefix: chore
      include: scope
    # Repo exceptions: deliberate ignores.
    ignore:
      # Types track the oldest supported Node major (engines: >=22.18.0).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Repo exceptions: no entry for /smoke. Its vite pin is bumped by hand.
  # Dependabot refuses to update a directory under pnpm-workspace.yaml, even
  # one outside the workspace like the smoke test (ADR-0010).

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Dublin
    cooldown:
      default-days: 7
    groups:
      # Majors stay out of the group, so each one gets its own PR.
      github-actions:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: ci
      include: scope
