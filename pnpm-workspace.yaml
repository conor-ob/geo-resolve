packages:
  - packages/*
  - tools/*

catalogMode: prefer

# A dependency update that leaves a package outside a peer's range fails the install.
strictPeerDependencies: true

catalog:
  "@arethetypeswrong/core": 0.18.5
  "@changesets/cli": 3.0.3
  "@microsoft/api-extractor": 7.60.1
  "@types/node": ^22
  fast-xml-parser: 5.12.1
  publint: 0.3.25
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: 1.7.0
  zod: 4.6.7
catalogs:
  # TypeDoc needs the TypeScript JavaScript API, which TypeScript 7 doesn't ship, so it runs on TypeScript 6.
  typedoc:
    typedoc: 0.28.20
    typescript: 6.0.3
# Strict-peers exceptions. vite-plus's core stands in for Vite: every `vite` resolves to the catalog's core
# alias, and the peer rules accept it. Without the override a second Vite is installed (#116).
# .github/scripts/check-single-vite-plus-core.sh checks the alias and vite-plus agree.
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
